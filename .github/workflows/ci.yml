name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . ruff pytest pytest-cov bandit pyright
      - name: Lint
        run: ruff check hoardcore.py tests/
      - name: Security audit (bandit)
        run: bandit -q hoardcore.py
      - name: Type check (pyright)
        run: pyright hoardcore.py --pythonpath $(which python)
      - name: Test
        run: python -m pytest tests/ -q --cov=hoardcore --cov-fail-under=66