name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . ruff pytest pytest-cov bandit pyright
      - name: Version sync check
        run: python tools/check_version.py
      - name: Lint
        run: ruff check hoardcore.py tests/
      - name: Security audit (bandit)
        run: bandit -q hoardcore.py
      - name: Type check (pyright)
        run: pyright hoardcore.py --pythonpath $(which python)
      - name: Test
        run: python -m pytest tests/ -q --cov=hoardcore --cov-fail-under=70

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Vector-search regression gate
        run: python tools/bench_vector.py --vectors 20000 --max-ms 500
