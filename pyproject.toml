[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hoardcore-rag"
version = "0.1.0"
description = "Lightweight universal LLM document ingestion engine with hybrid FTS+vector retrieval and live web discovery."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.8",
    "curl_cffi>=0.6",
    "trafilatura>=1.6",
    "readability-lxml>=0.8",
    "lxml>=4.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.21"]
docx = ["python-docx>=1.0"]
epub = ["ebooklib>=0.18"]
test = ["pytest>=8"]

[project.scripts]
hoardcore = "hoardcore:cli_entry"

[tool.setuptools]
py-modules = ["hoardcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
