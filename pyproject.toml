[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hoardcore"
version = "0.12.0"
description = "Research toolkit for AI agents (single-file Python module + SQLite vault + CLI): DISCOVER→INGEST→RECALL→EMIT, hybrid retrieval, provenance tagging, Cloudflare-aware fetching."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HoardCore contributors" }]
keywords = ["agent", "llm", "sqlite", "fts5", "retrieval", "research", "scraping", "toolkit", "protocol", "knowledge-base"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "aiohttp>=3.8",
    "curl_cffi>=0.6",
    "trafilatura>=1.6",
    "readability-lxml>=0.8",
    "lxml>=4.9",
    "tomli>=2.0; python_version < '3.11'",
    "fastembed>=0.8",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.21"]
docx = ["python-docx>=1.0"]
epub = ["ebooklib>=0.18"]
ocr = ["rapidocr_onnxruntime>=1.4"]
test = ["pytest>=8"]

[project.scripts]
hoardcore = "hoardcore:cli_entry"

[tool.setuptools]
py-modules = ["hoardcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM"]

